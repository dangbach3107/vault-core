<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: #3d0710;
      }
      body {
        font-family:
          'Be Vietnam Pro',
          'Noto Sans',
          system-ui,
          -apple-system,
          sans-serif;
        color: #1e1315;
      }
      #stage {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: linear-gradient(160deg, #570b18, #3d0710 70%);
      }
      #glowA,
      #glowB {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      #glowA {
        width: 620px;
        height: 620px;
        background: #a8223f;
        opacity: 0.55;
      }
      #glowB {
        width: 520px;
        height: 520px;
        background: #6f1225;
        opacity: 0.6;
      }
      #grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.045) 1px,
            transparent 1px
          );
        background-size: 64px 64px;
      }
      #scene {
        position: absolute;
        left: 0;
        top: 0;
        width: 1600px;
        height: 900px;
        perspective: 1800px;
      }
      .card {
        position: absolute;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 22px;
        box-shadow:
          0 40px 100px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        overflow: hidden;
      }
      #win {
        left: 880px;
        top: 260px;
        width: 700px;
        padding: 26px 28px 14px;
        transform-origin: 50% 50%;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 18px;
        padding-bottom: 20px;
        margin-bottom: 8px;
        border-bottom: 1px solid #e6dfe0;
        font-size: 20px;
        font-weight: 600;
        color: #594b4e;
      }
      .dots i {
        display: inline-block;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #d3c8ca;
        margin-right: 8px;
      }
      .row {
        position: relative;
        display: grid;
        grid-template-columns: 38px 1fr auto auto;
        align-items: center;
        gap: 18px;
        padding: 21px 10px;
        font-size: 22px;
        border-bottom: 1px solid #f1eced;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row .tint {
        position: absolute;
        inset: 0;
        background: #f7e1e6;
        opacity: 0;
        border-radius: 10px;
      }
      .row > * {
        position: relative;
      }
      .fold {
        width: 36px;
        height: 26px;
        border-radius: 5px 8px 8px 8px;
        background: linear-gradient(#e4a9b6, #a8223f);
      }
      .name {
        font-weight: 600;
      }
      .cnt {
        font-size: 18px;
        color: #75666a;
      }
      .badge {
        min-width: 112px;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 999px;
      }
      .b-lock {
        color: #b42318;
        background: #fef3f2;
      }
      .b-part {
        color: #93500b;
        background: #fff7e8;
      }
      .b-full {
        color: #146c3a;
        background: #edf8f1;
      }
      #sweep {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 220px;
        left: -300px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(168, 34, 63, 0.1),
          transparent
        );
      }
      .float {
        padding: 22px 28px;
      }
      .lbl {
        font-size: 15px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #75666a;
        margin-bottom: 6px;
      }
      .float strong {
        display: block;
        font-size: 26px;
      }
      #fa {
        left: 1330px;
        top: 150px;
        width: 270px;
      }
      #fb {
        left: 740px;
        top: 650px;
        width: 360px;
      }
      .chips {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .chip {
        font-size: 19px;
        font-weight: 700;
        padding: 6px 18px;
        border-radius: 9px;
        background: #f1eced;
        color: #75666a;
      }
      .bar {
        height: 10px;
        margin-top: 18px;
        border-radius: 99px;
        background: #f1eced;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #8c1832, #e4a9b6);
      }
      #fc {
        left: 1250px;
        top: 700px;
        width: 300px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 26px;
      }
      #ok {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #edf8f1;
        display: grid;
        place-items: center;
      }
      #ok svg {
        width: 26px;
        height: 26px;
      }
      #fc strong {
        font-size: 22px;
        display: block;
      }
      #fc small {
        font-size: 16px;
        color: #75666a;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="glowA"></div>
      <div id="glowB"></div>
      <div id="grid"></div>
      <div id="scene">
        <div class="card" id="win">
          <div class="head">
            <span class="dots"><i></i><i></i><i></i></span
            ><span>Phòng dữ liệu · Dự án Alpha</span>
          </div>
          <div class="row">
            <span class="tint"></span><span class="fold"></span
            ><span class="name">01 Pháp lý</span
            ><span class="cnt">12 tài liệu</span
            ><span class="badge b-lock">Khoá</span>
          </div>
          <div class="row">
            <span class="tint"></span><span class="fold"></span
            ><span class="name">02 Tài chính</span
            ><span class="cnt">8 tài liệu</span
            ><span class="badge b-lock">Khoá</span>
          </div>
          <div class="row">
            <span class="tint"></span><span class="fold"></span
            ><span class="name">03 Công nghệ</span
            ><span class="cnt">5 tài liệu</span
            ><span class="badge b-lock">Khoá</span>
          </div>
          <div class="row">
            <span class="tint"></span><span class="fold"></span
            ><span class="name">04 Nhân sự</span
            ><span class="cnt">3 tài liệu</span
            ><span class="badge b-lock">Khoá</span>
          </div>
          <div id="sweep"></div>
        </div>
        <div class="card float" id="fa">
          <p class="lbl">Trust Profile</p>
          <strong>VAULT-0142</strong>
          <div class="chips">
            <span class="chip">L1</span><span class="chip">L2</span
            ><span class="chip">L3</span>
          </div>
        </div>
        <div class="card float" id="fb">
          <p class="lbl">Quyền truy cập</p>
          <strong>Hết hạn sau 30 ngày</strong>
          <div class="bar"><span></span></div>
        </div>
        <div class="card float" id="fc">
          <div id="ok">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#146c3a"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
          </div>
          <div><strong>NDA đã ký</strong><small>Legal đã duyệt</small></div>
        </div>
      </div>
    </div>
    <script>
      const T = 8,
        TAU = Math.PI * 2
      const clamp = (x) => Math.max(0, Math.min(1, x))
      const sstep = (x) => {
        x = clamp(x)
        return x * x * (3 - 2 * x)
      }
      const $ = (s) => document.querySelector(s)
      const rows = [...document.querySelectorAll('.row')]
      const chips = [...document.querySelectorAll('.chip')]
      const els = {
        win: $('#win'),
        fa: $('#fa'),
        fb: $('#fb'),
        fc: $('#fc'),
        bar: $('.bar span'),
        sweep: $('#sweep'),
        gA: $('#glowA'),
        gB: $('#glowB'),
        grid: $('#grid'),
      }

      // Everything is a pure function of t and returns to its t=0 state at t=T (seamless loop).
      window.render = (t) => {
        t = t % T
        const loopOff = 1 - sstep((t - 7.3) / 0.6) // 1 until 7.3s, then fades the progress state away
        const phase = (t / T) * TAU

        els.gA.style.transform = `translate(${1000 + 70 * Math.sin(phase)}px, ${-120 + 50 * Math.cos(phase)}px)`
        els.gB.style.transform = `translate(${-80 + 60 * Math.cos(phase)}px, ${520 + 40 * Math.sin(phase)}px)`
        els.grid.style.transform = `translateY(${(t / T) * 64}px)`

        els.win.style.transform = `rotateY(-7deg) rotateX(3deg) translateY(${6 * Math.sin(phase)}px)`
        els.fa.style.transform = `rotateY(-7deg) translateY(${10 * Math.sin(phase + 1.2)}px)`
        els.fb.style.transform = `rotateY(-7deg) translateY(${9 * Math.sin(phase + 3.1)}px)`
        els.fc.style.transform = `rotateY(-7deg) translateY(${9 * Math.sin(phase + 4.6)}px)`

        rows.forEach((row, i) => {
          const a = 0.9 + 1.15 * i,
            b = a + 0.85
          let kind = 'b-lock',
            text = 'Khoá'
          if (t >= a && t < 7.3) {
            kind = 'b-part'
            text = 'Một phần'
          }
          if (t >= b && t < 7.3) {
            kind = 'b-full'
            text = 'Đã mở'
          }
          const badge = row.querySelector('.badge')
          badge.className = 'badge ' + kind
          badge.textContent = text
          const pulse = sstep((t - a) / 0.3) * (1 - sstep((t - a - 0.5) / 0.7))
          row.querySelector('.tint').style.opacity = pulse.toFixed(3)
        })

        const chipAt = [1.3, 3.3, 5.3]
        chips.forEach((chip, i) => {
          const on = sstep((t - chipAt[i]) / 0.35) * loopOff
          chip.style.background = `rgb(${241 - 101 * on}, ${236 - 212 * on}, ${237 - 187 * on})`
          chip.style.color = on > 0.5 ? '#fff' : '#75666a'
          chip.style.transform = `scale(${1 + 0.12 * Math.sin(Math.PI * clamp((t - chipAt[i]) / 0.5))})`
        })

        const v = sstep((t - 0.9) / 5.6) * 0.78 * loopOff
        els.bar.style.width = (v * 100).toFixed(2) + '%'

        const ok = sstep((t - 5.6) / 0.4) * loopOff
        els.fc.style.opacity = ok.toFixed(3)
        els.fc.style.marginTop = `${(1 - ok) * 24}px`

        els.sweep.style.left = `${-300 + sstep((t - 0.4) / 6.2) * 1250}px`
        els.sweep.style.opacity = t > 0.4 && t < 6.6 ? 1 : 0
      }
      window.render(0)
    </script>
  </body>
</html>
