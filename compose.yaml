name: vault-core-local
services:
  database:
    image: postgres:17.9
    environment:
      POSTGRES_USER: vault
      POSTGRES_DB: vault
      POSTGRES_PASSWORD: ${VAULT_LOCAL_DB_PASSWORD:?Run scripts/start-database.ps1 first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vault_postgres:/var/lib/postgresql/data
      - ./scripts/database-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  vault_postgres:
