services:
  - type: web
    name: vault-core-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: ./scripts/start-production.sh
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: INTERNAL_PREVIEW_ENABLED
        value: "true"
      - key: ALLOW_PUBLIC_ACCESS
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
