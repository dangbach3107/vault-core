services:
  - type: web
    name: vault-core
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: INTERNAL_PREVIEW_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DEMO_ROLE_PASSWORD
        sync: false
      - key: DEMO_AUTH_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false # <service>.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false # https://<service>.onrender.com
