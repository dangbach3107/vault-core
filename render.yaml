services:
  - type: web
    name: vault-core-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt && python -m alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PROJECT_NAME
        value: VAULT Core
      - key: VERSION
        value: 0.1.0
      - key: API_V1_STR
        value: /api/v1
      - key: ENVIRONMENT
        value: hosted-demo
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_PREVIEW_ENABLED
        value: "true"
      - key: UPLOAD_DIRECTORY
        value: /var/data/vault-uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: ALLOWED_HOSTS
        value: vault-core-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://frontend-xi-eosin-36.vercel.app
      # Optional: add DEMO_PASSWORD in Render dashboard for a shared internal demo gate.
    disk:
      name: vault-demo-uploads
      mountPath: /var/data
      sizeGB: 1
